 
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เกมงูเก็บอาหาร</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  font-family: Tahoma, Arial, sans-serif;
  color: white;
  background: linear-gradient(135deg, #052e16, #14532d);
}

.game {
  width: min(100%, 480px);
  padding: 22px;
  text-align: center;
  border-radius: 20px;
  background: #10291c;
  border: 1px solid #4ade80;
  box-shadow: 0 10px 30px #0006;
}

h1 { color: #86efac; }

.scores {
  display: flex;
  justify-content: space-around;
  margin-bottom: 15px;
  gap: 8px;
}

.scores div {
  background: #166534;
  border-radius: 10px;
  padding: 10px;
  flex: 1;
}

canvas {
  width: 100%;
  height: auto;
  display: block;
  background: #071b11;
  border: 3px solid #4ade80;
  border-radius: 8px;
}

#message {
  min-height: 28px;
  color: #fde68a;
  margin: 15px 0;
}

button {
  padding: 11px 14px;
  margin: 4px;
  border: none;
  border-radius: 8px;
  background: #86efac;
  color: #052e16;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}

button:hover { background: #bbf7d0; }

.help {
  color: #bbf7d0;
  font-size: 13px;
  line-height: 1.8;
}

.controls {
  margin: 12px auto;
  display: grid;
  grid-template-columns: repeat(3, 48px);
  gap: 4px;
  justify-content: center;
}

.controls button {
  margin: 0;
  font-size: 18px;
  background: #166534;
  color: white;
}

.up { grid-column: 2; }
.left { grid-column: 1; }
.down { grid-column: 2; }
.right { grid-column: 3; }
</style>
</head>

<body>
<div class="game">
  <h1>🐍 เกมงูเก็บอาหาร</h1>

  <div class="scores">
    <div>คะแนน<br><strong id="score">0</strong></div>
    <div>คะแนนสูงสุด<br><strong id="best">0</strong></div>
  </div>

  <canvas id="board" width="400" height="400"></canvas>

  <p id="message">กดเริ่มเกมเพื่อเล่น</p>

  <button id="start">▶ เริ่มเกม</button>
  <button id="pause">⏸ หยุด / เล่นต่อ</button>
  <button id="restart">🔄 เริ่มใหม่</button>

  <div class="controls">
    <button class="up" data-dir="up">▲</button>
    <button class="left" data-dir="left">◀</button>
    <button class="down" data-dir="down">▼</button>
    <button class="right" data-dir="right">▶</button>
  </div>

  <p class="help">
    ใช้ปุ่มลูกศร หรือ W A S D เพื่อบังคับงู<br>
    กด Space เพื่อหยุดหรือเล่นต่อ<br>
    เก็บอาหารสีแดงเพื่อรับ 10 คะแนน<br>
    ห้ามชนกำแพงหรือตัวงูเอง!
  </p>
</div>

<script>
const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");
const scoreText = document.getElementById("score");
const bestText = document.getElementById("best");
const message = document.getElementById("message");

const size = 20;
const cell = canvas.width / size;

let snake, food, dir, nextDir;
let score = 0;
let best = 0;
let timer = null;
let running = false;
let paused = false;
let over = false;

try {
  best = Number(localStorage.getItem("snakeBest") || 0);
} catch (e) {}

bestText.textContent = best;

function makeFood() {
  let f;
  do {
    f = {
      x: Math.floor(Math.random() * size),
      y: Math.floor(Math.random() * size)
    };
  } while (
    snake.some(p => p.x === f.x && p.y === f.y)
  );
  return f;
}

function reset() {
  clearInterval(timer);

  snake = [
    { x: 10, y: 10 },
    { x: 9, y: 10 },
    { x: 8, y: 10 }
  ];

  dir = { x: 1, y: 0 };
  nextDir = { x: 1, y: 0 };
  score = 0;
  food = makeFood();

  running = false;
  paused = false;
  over = false;

  scoreText.textContent = 0;
  message.textContent = "กดเริ่มเกมเพื่อเล่น";
  document.getElementById("start").textContent = "▶ เริ่มเกม";

  draw();
}

function startGame() {
  if (over) reset();
  if (running && !paused) return;

  running = true;
  paused = false;
  message.textContent = "เก็บอาหารให้ได้มากที่สุด!";
  document.getElementById("start").textContent = "▶ เล่นเกม";

  clearInterval(timer);
  timer = setInterval(tick, speed());
  draw();
}

function speed() {
  return Math.max(65, 150 - Math.floor(score / 50) * 10);
}

function togglePause() {
  if (over) return;

  if (!running) {
    startGame();
    return;
  }

  paused = !paused;

  if (paused) {
    clearInterval(timer);
    message.textContent = "หยุดเกมชั่วคราว";
  } else {
    message.textContent = "เล่นต่อได้เลย!";
    clearInterval(timer);
    timer = setInterval(tick, speed());
  }

  draw();
}

function changeDirection(name) {
  const directions = {
    up:    { x: 0, y: -1 },
    down:  { x: 0, y: 1 },
    left:  { x: -1, y: 0 },
    right: { x: 1, y: 0 }
  };

  const d = directions[name];
  if (!d) return;

  if (d.x === -dir.x && d.y === -dir.y) return;

  nextDir = d;

  if (!running && !over) startGame();
}

function tick() {
  if (!running || paused || over) return;

  dir = nextDir;

  const head = {
    x: snake[0].x + dir.x,
    y: snake[0].y + dir.y
  };

  const eating = head.x === food.x && head.y === food.y;
  const body = eating ? snake : snake.slice(0, -1);

  // ตรวจสอบการชนกำแพงและตัวเอง
  if (
    head.x < 0 || head.x >= size ||
    head.y < 0 || head.y >= size ||
    body.some(p => p.x === head.x && p.y === head.y)
  ) {
    endGame();
    return;
  }

  snake.unshift(head);

  if (eating) {
    score += 10;
    scoreText.textContent = score;
    food = makeFood();

    if (score > best) {
      best = score;
      bestText.textContent = best;

      try {
        localStorage.setItem("snakeBest", String(best));
      } catch (e) {}
    }

    clearInterval(timer);
    timer = setInterval(tick, speed());
  } else {
    snake.pop();
  }

  draw();
}

function draw() {
  ctx.fillStyle = "#071b11";
  ctx.fillRect(0, 0, 400, 400);

  // เส้นตาราง
  ctx.strokeStyle = "#123522";

  for (let i = 0; i <= size; i++) {
    ctx.beginPath();
    ctx.moveTo(i * cell, 0);
    ctx.lineTo(i * cell, 400);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(0, i * cell);
    ctx.lineTo(400, i * cell);
    ctx.stroke();
  }

  // อาหาร
  ctx.fillStyle = "#ef4444";
  ctx.beginPath();
  ctx.arc(
    food.x * cell + 10,
    food.y * cell + 10,
    7,
    0,
    Math.PI * 2
  );
  ctx.fill();

  ctx.fillStyle = "#4ade80";
  ctx.fillRect(food.x * cell + 11, food.y * cell + 1, 3, 5);

  // ตัวงู
  snake.forEach((p, i) => {
    ctx.fillStyle = i === 0 ? "#bbf7d0" : "#22c55e";
    ctx.beginPath();
    ctx.roundRect(
      p.x * cell + 1,
      p.y * cell + 1,
      cell - 2,
      cell - 2,
      5
    );
    ctx.fill();
  });

  // ดวงตางู
  ctx.fillStyle = "#064e3b";

  const h = snake[0];
  let eyes;

  if (dir.x === 1) {
    eyes = [[14, 6], [14, 14]];
  } else if (dir.x === -1) {
    eyes = [[6, 6], [6, 14]];
  } else if (dir.y === -1) {
    eyes = [[6, 6], [14, 6]];
  } else {
    eyes = [[6, 14], [14, 14]];
  }

  eyes.forEach(([x, y]) => {
    ctx.beginPath();
    ctx.arc(h.x * cell + x, h.y * cell + y, 2, 0, Math.PI * 2);
    ctx.fill();
  });

  if (paused) {
    ctx.fillStyle = "#0009";
    ctx.fillRect(0, 0, 400, 400);
    ctx.fillStyle = "white";
    ctx.textAlign = "center";
    ctx.font = "bold 25px Tahoma";
    ctx.fillText("หยุดชั่วคราว", 200, 205);
  }
}

function endGame() {
  clearInterval(timer);
  running = false;
  over = true;

  message.textContent = "จบเกม! ได้ " + score + " คะแนน";
  document.getElementById("start").textContent = "▶ เล่นอีกครั้ง";

  draw();

  ctx.fillStyle = "#0009";
  ctx.fillRect(0, 0, 400, 400);
  ctx.fillStyle = "white";
  ctx.textAlign = "center";
  ctx.font = "bold 30px Tahoma";
  ctx.fillText("GAME OVER", 200, 190);
  ctx.font = "20px Tahoma";
  ctx.fillText("คะแนน: " + score, 200, 225);
}

document.addEventListener("keydown", event => {
  const key = event.key.toLowerCase();

  const keys = {
    arrowup: "up", w: "up",
    arrowdown: "down", s: "down",
    arrowleft: "left", a: "left",
    arrowright: "right", d: "right"
  };

  if (keys[key]) {
    event.preventDefault();
    changeDirection(keys[key]);
  }

  if (event.code === "Space") {
    event.preventDefault();
    togglePause();
  }
});

document.querySelectorAll("[data-dir]").forEach(button => {
  button.addEventListener("click", () => {
    changeDirection(button.dataset.dir);
  });
});

document.getElementById("start").addEventListener("click", startGame);
document.getElementById("pause").addEventListener("click", togglePause);
document.getElementById("restart").addEventListener("click", reset);

reset();
</script>
</body>
</html>
